<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">GPU Price History dashboard cover</title>
  <desc id="desc">Abstract chart cover showing cloud GPU rental prices and hardware market prices.</desc>
  <defs>
