<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Can local TTS beat cloud TTS?</title>
  <desc id="desc">A social cover comparing cloud TTS from ElevenLabs and OpenAI with local MisoTTS on Apple Silicon.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.52" stop-color="#111827"/>
      <stop offset="1" stop-color="#06281f"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <path d="M0 655 C220 592 371 710 586 642 C804 573 924 440 1140 506 C1300 554 1448 497 1600 438 L1600 900 L0 900 Z" fill="#0f766e" opacity="0.16"/>
  <path d="M0 220 C240 150 360 248 548 191 C762 126 920 68 1138 160 C1310 232 1450 196 1600 124 L1600 0 L0 0 Z" fill="#2563eb" opacity="0.18"/>

  <text x="112" y="124" fill="#93c5fd" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">LOCAL AI VOICE TEST</text>
  <text x="112" y="232" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="86" font-weight="900">Can Local TTS</text>
  <text x="112" y="330" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="86" font-weight="900">Beat the Cloud?</text>
  <text x="116" y="392" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="33">MisoTTS on Apple Silicon, compared against the names everyone knows.</text>

  <g transform="translate(112 486)">
    <rect x="8" y="18" width="540" height="250" rx="30" fill="#000000" opacity="0.22"/>
    <rect x="0" y="0" width="540" height="250" rx="30" fill="#f8fafc"/>
    <text x="40" y="62" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="900">CLOUD TTS</text>
    <text x="40" y="106" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="24">API voices people already trust</text>
    <rect x="40" y="138" width="206" height="68" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <image href="./logos/elevenlabs-logo-black.svg" x="64" y="156" width="158" height="32" preserveAspectRatio="xMidYMid meet"/>
    <rect x="272" y="138" width="206" height="68" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <image href="./logos/openai-logo.svg" x="304" y="156" width="142" height="36" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <g transform="translate(948 486)">
    <rect x="8" y="18" width="540" height="250" rx="30" fill="#000000" opacity="0.22"/>
    <rect x="0" y="0" width="540" height="250" rx="30" fill="#ecfdf5"/>
    <text x="40" y="62" fill="#064e3b" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="900">LOCAL TTS</text>
    <text x="40" y="106" fill="#047857" font-family="Inter, Arial, sans-serif" font-size="24">Offline voice generation on my Mac</text>
    <rect x="40" y="138" width="206" height="68" rx="18" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <text x="72" y="181" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900">MisoTTS</text>
    <rect x="272" y="138" width="206" height="68" rx="18" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <text x="322" y="181" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900">MLX</text>
  </g>

  <g transform="translate(676 490)">
    <circle cx="130" cy="140" r="102" fill="#000000" opacity="0.22"/>
    <circle cx="122" cy="122" r="102" fill="#f8fafc"/>
    <circle cx="122" cy="122" r="74" fill="#111827"/>
    <path d="M102 78 L102 166 L174 122 Z" fill="#34d399"/>
    <g fill="url(#wave)">
      <rect x="-56" y="82" width="16" height="80" rx="8"/>
      <rect x="-22" y="50" width="16" height="144" rx="8"/>
      <rect x="254" y="50" width="16" height="144" rx="8"/>
      <rect x="288" y="82" width="16" height="80" rx="8"/>
    </g>
  </g>

  <g transform="translate(111 792)">
    <rect x="0" y="0" width="206" height="50" rx="25" fill="#172554"/>
    <text x="30" y="33" fill="#bfdbfe" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800">5 voice samples</text>
    <rect x="230" y="0" width="228" height="50" rx="25" fill="#052e2b"/>
    <text x="262" y="33" fill="#99f6e4" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800">playable audio</text>
    <rect x="482" y="0" width="234" height="50" rx="25" fill="#312e81"/>
    <text x="514" y="33" fill="#ddd6fe" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800">fully local run</text>
  </g>
</svg>
