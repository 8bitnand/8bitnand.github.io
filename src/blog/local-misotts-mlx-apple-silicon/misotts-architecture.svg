<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">MisoTTS architecture overview</title>
  <desc id="desc">Simplified diagram of MisoTTS using text and audio context, a 7.7B backbone, a 300M depth decoder, 32 RVQ codebooks, Mimi audio codes, and waveform output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>
  <text x="70" y="88" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800">MisoTTS 8B: text + audio context to RVQ audio codes</text>
  <text x="72" y="132" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="24">Simplified from the Miso Labs architecture description.</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="70" y="220" width="230" height="150" rx="22" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
    <text x="102" y="276" fill="#1e3a8a" font-size="28" font-weight="800">Text tokens</text>
    <text x="102" y="322" fill="#334155" font-size="22">target script</text>

    <rect x="70" y="430" width="230" height="150" rx="22" fill="#ede9fe" stroke="#c4b5fd" stroke-width="2"/>
    <text x="102" y="486" fill="#4c1d95" font-size="28" font-weight="800">Audio context</text>
    <text x="102" y="532" fill="#334155" font-size="22">reference voice</text>

    <line x1="310" y1="295" x2="432" y2="352" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="310" y1="505" x2="432" y2="428" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="440" y="265" width="285" height="245" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="482" y="330" fill="#0f172a" font-size="30" font-weight="850">7.7B backbone</text>
    <text x="482" y="374" fill="#475569" font-size="22">Llama-style transformer</text>
    <text x="482" y="418" fill="#475569" font-size="22">models sequence over time</text>
    <text x="482" y="462" fill="#0f766e" font-size="22" font-weight="750">predicts codebook 1</text>

    <line x1="736" y1="388" x2="832" y2="388" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="845" y="265" width="285" height="245" rx="26" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <text x="886" y="330" fill="#064e3b" font-size="30" font-weight="850">300M decoder</text>
    <text x="886" y="374" fill="#047857" font-size="22">autoregressive over depth</text>
    <text x="886" y="418" fill="#047857" font-size="22">fills codebooks 2-32</text>
    <text x="886" y="462" fill="#0f172a" font-size="22" font-weight="750">reuses same parameters</text>

    <line x1="1142" y1="388" x2="1228" y2="388" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="1240" y="230" width="105" height="315" rx="18" fill="#0f172a"/>
    <g fill="#38bdf8">
      <rect x="1264" y="262" width="18" height="250" rx="9"/>
      <rect x="1294" y="294" width="18" height="186" rx="9"/>
      <rect x="1324" y="330" width="18" height="114" rx="9"/>
    </g>
    <text x="1178" y="598" fill="#0f172a" font-size="27" font-weight="800">32 x 2048</text>
    <text x="1138" y="634" fill="#475569" font-size="22">RVQ audio codebooks</text>

    <line x1="1292" y1="548" x2="1292" y2="640" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="1052" y="654" width="480" height="62" rx="31" fill="#111827"/>
    <text x="1128" y="696" fill="#f8fafc" font-size="24" font-weight="800">Mimi codes → waveform audio</text>
  </g>
</svg>
